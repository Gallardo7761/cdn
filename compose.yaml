x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp
  restart: unless-stopped

name: cdn

services:
  web:
    <<: *hardening
    mem_limit: 64m
    pids_limit: 64
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    build:
      context: .
    image: git.killobyte.es/gallardo7761/cdn-web:${WEB_VERSION:-latest}
    container_name: cdn-web
    restart: unless-stopped
    networks:
      - cdn_net
    volumes:
      - ${CDN_FILES_DIR:-/var/www/files}:/srv/files:ro
    logging:
      options:
        max-size: 10m
        max-file: "3"

  api:
    <<: *hardening
    mem_limit: 256m
    pids_limit: 128
    build:
      context: ./api
    image: git.killobyte.es/gallardo7761/cdn-api:${WEB_VERSION:-latest}
    container_name: cdn-api
    restart: unless-stopped
    user: "${CDN_UID:-1000}:${CDN_GID:-33}"
    networks:
      - cdn_net
    volumes:
      - ${CDN_FILES_DIR:-/var/www/files}:/srv/files
    logging:
      options:
        max-size: 10m
        max-file: "3"

networks:
  cdn_net:
    external: true

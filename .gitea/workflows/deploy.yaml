name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: git.killobyte.es/gallardo7761/cdn-web
  API_IMAGE: git.killobyte.es/gallardo7761/cdn-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    container:
      image: catthehacker/ubuntu:act-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Versioning
        id: version
        run: |
          VERSION=$(sed -n 's/^ *"version": *"\(.*\)",*$/\1/p' package.json | head -n 1)
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::La versión de package.json no es major.minor.fix: '$VERSION'"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::v$VERSION ya está publicada. Sube la versión en package.json."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Login Registry
        uses: docker/login-action@v3
        with:
          registry: git.killobyte.es
          username: ${{ gitea.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Image
        env:
          WEB_VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker compose build
          for image in "$IMAGE" "$API_IMAGE"; do
            docker tag "$image:$WEB_VERSION" "$image:latest"
            docker push "$image:$WEB_VERSION"
            docker push "$image:latest"
          done

      - name: Container
        env:
          WEB_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! docker network inspect cdn_net > /dev/null 2>&1; then
            echo "::error::Falta la red cdn_net. Créala con 'docker network create --internal cdn_net' y conecta el proxy a ella."
            exit 1
          fi
          docker compose up -d --no-build --remove-orphans

      - name: Git tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Clean orphan images
        run: docker image prune -f
